name = "intent-check-judge"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Secrets are NOT declared here — anything under [vars] is baked into the
# deployed Worker and is readable by anyone with the repo. Set them with:
#   wrangler secret put JUDGE_API_KEY
#   wrangler secret put OPENAI_API_KEY
#   wrangler secret put GRAPH_API_KEY
#   wrangler secret put GRAPH_TOKEN_API_JWT
# Local development reads the same names from apps/judge/.dev.vars.

# Durable cache for slow upstreams. An in-memory cache is useless here: each
# request can land in a fresh isolate, so a value written by one is invisible to
# the next. The Token API takes ~10s per call, which is why it is cached at all.
[[kv_namespaces]]
binding = "EVZI_CACHE"
id = "7bdae181bfdc49c7b39773ffea22817f"
